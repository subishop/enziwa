<style>
:root{
  --ground:#f6f1e9; --card:#fbf8f3; --ink:#1f1a17; --muted:#7b6f64; --line:#e3d9cb;
  --brand:#78008F; --brand-soft:#efe1f2; --clay:#b4683f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#15111a; --card:#1d1822; --ink:#f2ebe2; --muted:#ab9f93; --line:#342b3a;
    --brand:#c77ad8; --brand-soft:#2c1f33; --clay:#d99368;
  }
}
:root[data-theme="dark"]{
  --ground:#15111a; --card:#1d1822; --ink:#f2ebe2; --muted:#ab9f93; --line:#342b3a;
  --brand:#c77ad8; --brand-soft:#2c1f33; --clay:#d99368;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 72px}

/* Chevron band, from the W and A of the logo */
.band{height:14px;color:var(--brand);opacity:.9}
.band svg{display:block;width:100%;height:14px}

header{padding:44px 0 26px;text-align:center}
.logo{width:min(280px,70vw);height:auto;color:var(--ink);display:block;margin:0 auto}
.kicker{font-family:Jost,Inter,sans-serif;font-weight:300;text-transform:uppercase;letter-spacing:.42em;font-size:12px;color:var(--muted);margin:22px 0 0;padding-left:.42em}
.ring{display:inline-block;width:7px;height:7px;border:1.5px solid var(--brand);border-radius:50%;margin:0 12px;vertical-align:middle}

.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;margin:6px 0 30px;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-family:Jost,Inter,sans-serif}
.legend span{display:inline-flex;align-items:center;gap:8px}

/* Note marks: chevron for top, ring for heart, bar for base */
.mark{width:12px;height:12px;flex:0 0 12px;color:var(--brand)}

.key{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:64px 1fr;gap:4px 16px;padding:20px 2px;border-bottom:1px solid var(--line)}
.num{grid-row:span 2;align-self:start;position:relative;width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-family:Jost,Inter,sans-serif;font-weight:400;font-size:20px;color:var(--ink);letter-spacing:.04em}
/* Open frame, from the E of the logo */
.num::before{content:"";position:absolute;inset:0;border:1.5px solid var(--brand);border-right-color:transparent}
.num::after{content:"";position:absolute;right:0;top:0;bottom:0;width:1.5px;background:linear-gradient(var(--brand) 0 22%,transparent 22% 78%,var(--brand) 78%)}
.name{font-family:Jost,Inter,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.16em;font-size:17px;margin:2px 0 8px;line-height:1.3}
.notes{display:grid;gap:5px}
details.all{margin-top:4px}
details.all summary{cursor:pointer;list-style:none;font-family:Jost,Inter,sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--brand);padding:4px 0;display:inline-flex;align-items:center;gap:6px}
details.all summary::-webkit-details-marker{display:none}
details.all summary::after{content:"+";font-size:14px;letter-spacing:0}
details.all[open] summary::after{content:"−"}
.allbody{display:grid;gap:5px;padding:8px 0 2px;border-top:1px solid var(--line);margin-top:4px}
.tier{display:grid;grid-template-columns:18px 52px 1fr;align-items:start;gap:6px;font-size:14px}
.tier .mark{margin-top:5px}
.tier b{font-weight:500;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;line-height:22px}

@media (min-width:760px){
  .row{grid-template-columns:72px minmax(170px,240px) 1fr;align-items:start;gap:0 22px;padding:22px 4px}
  .num{grid-row:auto}
  .name{margin:12px 0 0}
  .notes{gap:6px;padding-top:4px}
}

.search{display:block;width:100%;max-width:420px;margin:0 auto 22px;padding:12px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.search:focus{outline:2px solid var(--brand);outline-offset:2px}
.empty{text-align:center;color:var(--muted);padding:30px 0;display:none}

footer{text-align:center;color:var(--muted);font-size:12px;margin-top:36px;font-family:Jost,Inter,sans-serif;letter-spacing:.3em;text-transform:uppercase}
.theme{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 14px;font:inherit;font-size:11px;letter-spacing:.2em;cursor:pointer;margin-top:14px}
</style>
</head>

const key = document.getElementById("key");
key.innerHTML = BLENDS.map(([n,name,top,heart,base]) => {
  const tier = (label, list) => `<div class="tier">${MARKS[label]}<b>${label}</b><span>${list.join(", ")}</span></div>`;
  const f0 = FULL[n] || [[],[],[]];
  const merge = (a, b) => { const s = new Set(); return [...a, ...b].filter(x => { const k = x.toLowerCase(); if (s.has(k)) return false; s.add(k); return true; }); };
  const full = [merge(top, f0[0]), merge(heart, f0[1]), merge(base, f0[2])];
  const hay = [n,name,...full.flat()].join(" ").toLowerCase();
  const ftier = (label, list) => list.length ? `<div class="tier">${MARKS[label]}<b>${label}</b><span>${list.join(", ")}</span></div>` : "";
  return `<div class="row" role="listitem" data-hay="${hay}">
    <div class="num">${String(n).padStart(2,"0")}</div>
    <div class="name">${name}</div>
    <div class="notes">${tier("Top",top)}${tier("Heart",heart)}${tier("Base",base)}
      <details class="all"><summary>All notes</summary><div class="allbody">${ftier("Top",full[0])}${ftier("Heart",full[1])}${ftier("Base",full[2])}</div></details></div>
  </div>`;
}).join("");

const q = document.getElementById("q"), empty = document.getElementById("empty");
q.addEventListener("input", () => {
  const v = q.value.trim().toLowerCase();
  let shown = 0;
  key.querySelectorAll(".row").forEach(r => {
    const hit = !v || r.dataset.hay.includes(v) || r.querySelector(".num").textContent === v.padStart(2,"0");
    r.style.display = hit ? "" : "none";
    if (hit) shown++;
  });
  empty.style.display = shown ? "none" : "block";
});

document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("enziwaTheme", root.dataset.theme); } catch (e) {}
});
